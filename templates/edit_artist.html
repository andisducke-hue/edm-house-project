{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Edit Artist</h1>

    <form method="POST">

        <input type="text"
               name="name"
               value="{{ artist[1] }}"
               placeholder="Artist name">

        <input type="text"
               name="image"
               value="{{ artist[2] }}"
               placeholder="Image path">

        <textarea name="about"
                  placeholder="About artist">{{ artist[3] }}</textarea>

        <button type="submit">
            Save
        </button>

    </form>

</div>

{% endblock %}
