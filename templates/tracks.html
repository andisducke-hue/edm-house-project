{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Tracks</h1>

    <form method="POST" action="/add_track">
        <input type="text" name="title" placeholder="Track title" required>

        <input type="text" name="youtube_link" placeholder="YouTube link">

        <select name="artist_id">
            {% for artist in artists %}
                <option value="{{ artist[0] }}">{{ artist[1] }}</option>
            {% endfor %}
        </select>

        <select name="genre_id">
            {% for genre in genres %}
                <option value="{{ genre[0] }}">{{ genre[1] }}</option>
            {% endfor %}
        </select>

        <button type="submit">Add Track</button>
    </form>

    <hr>

    <div class="track-container">
    {% for track in tracks %}
        <div class="track-card">
            <h3>{{ track[1] }}</h3>
            <p>{{ track[3] }} — {{ track[4] }}</p>

            {% if track[2] %}
                <iframe width="100%" height="170"
                    src="{{ track[2] | replace('watch?v=', 'embed/') }}"
                    frameborder="0"
                    allowfullscreen>
                </iframe>
            {% else %}
                <p>No video</p>
            {% endif %}

            <br>
            <a class="btn delete" href="/delete_track/{{ track[0] }}">Delete</a>
            <a class="btn edit" href="/edit_track/{{ track[0] }}">Edit</a>
        </div>
    {% endfor %}
    </div>
    
</div>

{% endblock %}
